name: "Container Build & Deploy"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: ${{ github.ref_name == 'dev' && 'dev'
                || github.ref_name == 'test' && 'test'
                || github.ref_name == 'main' && 'prod' }}
  RESOURCE_GROUP: reactdotnet-management-RG # Must already be created
  STORAGE_ACCOUNT: tfstatereactdotnetfozzen # Created via the bootstrap
jobs:

  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    outputs: # Set metadata that next job needs
      webapp_name: ${{ steps.tf.outputs.webapp_name }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
       
      # Terraform Init (Read Only) to get environment names
      - name: Terraform Init
        working-directory: .github/Terraform/prod
        run: |
          terraform init \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=tfstate-$ENVIRONMENT" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Read Terraform outputs
        id: tf
        working-directory: .github/Terraform/prod
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> $GITHUB_OUTPUT
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT
          echo "webapp_name=$(terraform output -raw webapp_name)" >> $GITHUB_OUTPUT

      - name: Login to ACR via OIDC
        run: az acr login --name ${{ steps.tf.outputs.acr_name }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ steps.tf.outputs.acr_login_server }}/${{ github.repository }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          file: ReactApp1.Server/Dockerfile
          cache-from: type=gha
          tags: ${{ steps.meta.outputs.tags }}


  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ needs.build.outputs.webapp_name }}
          images: ${{ needs.build.outputs.image_tags }}