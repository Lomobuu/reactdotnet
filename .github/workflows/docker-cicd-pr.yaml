name: 'Container Pull request Build & Deploy'

on:
  workflow_run:
    workflows: ["Terraform Pull Request Plan & Apply"]     # must match the name: field in terraform-pr.yaml
    types:
      - completed

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: pr${{ github.event.workflow_run.pull_requests[0].number }} # Get the workflow run(which triggers THIS pipeline) and get the PR ID of that workflow run.
  RESOURCE_GROUP: reactdotnet-management-RG # Must already be created
  STORAGE_ACCOUNT: tfstatereactdotnetfozzen # Created via the bootstrap
jobs:

  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # Only start the job if the previous workflow did not fail.
    runs-on: ubuntu-latest
    environment: pr
    outputs: # Set metadata that next job needs
      webapp_name: ${{ steps.tf.outputs.webapp_name }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:

      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1

      # Terraform Init (Read Only) to get environment names
      - name: Terraform Init
        working-directory: .github/Terraform/pr
        run: |
          terraform init \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
            -backend-config="container_name=tfstate-$ENVIRONMENT" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Read Terraform outputs
        working-directory: .github/Terraform/pr
        id: tf
        shell: bash
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> $GITHUB_OUTPUT
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT
          echo "webapp_name=$(terraform output -raw webapp_name)" >> $GITHUB_OUTPUT

      - name: Login to ACR via OIDC
        run: az acr login --name ${{ steps.tf.outputs.acr_name }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ steps.tf.outputs.acr_login_server }}/${{ github.repository }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          file: ReactApp1.Server/Dockerfile
          cache-from: type=gha
          tags: ${{ steps.meta.outputs.tags }}


  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: pr
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:   
          app-name: ${{ needs.build.outputs.webapp_name }}
          images: ${{ needs.build.outputs.image_tags }}